# p130: Staging environment — isolated copy of the stack on separate ports/DBs.
# Code lives in /opt/ntcommerce-staging (git clone — can run any branch).
# Backend: 127.0.0.1:8002 | Mongo: staging internal | Redis: staging internal
# Public URL: https://nt-commerce.net:8443 (Cloudflare-proxied port, UFW-limited to CF ranges)
services:
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntcommerce-staging-backend
    env_file:
      - backend/.env
    environment:
      - MONGO_URL=mongodb://mongodb-staging:27017/ntcommerce_staging?replicaSet=rsStaging
      - DB_NAME=ntcommerce_staging
      - REDIS_URL=redis://redis-staging:6379/0
      - APP_ENV=staging
    volumes:
      - /opt/ntcommerce-staging/backend:/app
      - /opt/ntcommerce-staging/backups:/backups
    ports:
      - "127.0.0.1:8002:8001"
    restart: unless-stopped
    depends_on:
      - mongodb-staging
      - redis-staging
    networks:
      - ntc-staging

  mongodb-staging:
    image: mongo:7.0
    container_name: ntcommerce-staging-mongodb
    command: ["mongod", "--replSet", "rsStaging", "--bind_ip_all"]
    volumes:
      - staging_mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - ntc-staging

  redis-staging:
    image: redis:7-alpine
    container_name: ntcommerce-staging-redis
    restart: unless-stopped
    networks:
      - ntc-staging

networks:
  ntc-staging:
    driver: bridge

volumes:
  staging_mongodb_data:
