services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntcommerce-backend-1
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongodb:27017/ntcommerce
      - DB_NAME=ntcommerce
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/app
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - ntcommerce

  mongodb:
    image: mongo:7.0
    container_name: ntcommerce-mongodb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - ntcommerce

  redis:
    image: redis:7-alpine
    container_name: ntcommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ntcommerce

volumes:
  mongodb_data:
  redis_data:

networks:
  ntcommerce:
    driver: bridge
