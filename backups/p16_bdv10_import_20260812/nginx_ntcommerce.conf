server {
    listen 80;
    server_name 168.231.81.154;
    root /var/www/ntcommerce;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # JSON files (wilayas data) — serve directly
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed build assets are content-addressed — safe to cache long-term
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (index.html and every SPA route fallback, manifest,
    # service worker, icons) must ALWAYS revalidate — otherwise browsers
    # serve a stale app shell after each deploy (the blank-page bug).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
