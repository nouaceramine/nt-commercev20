server {
    listen 80 default_server;
    server_name nt-commerce.net 168.231.81.154;
    root /var/www/ntcommerce;
    index index.html;

    # p191: SSE realtime — no buffering, long read timeout (heartbeat every 25s)
    location /api/events/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # JSON files (wilayas data) — serve directly
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/ntc-security-headers.conf;
    }

    # Hashed build assets are content-addressed — safe to cache long-term
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/ntc-security-headers.conf;
    }

    # Everything else (index.html and every SPA route fallback, manifest,
    # service worker, icons) must ALWAYS revalidate — otherwise browsers
    # serve a stale app shell after each deploy (the blank-page bug).

    # p134: Dozzle centralized logs (own auth on /logs)
    location /logs/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # p48: Let's Encrypt http-01 (webroot) — must beat the SPA fallback
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/ntc-security-headers.conf;
    }

    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nt-commerce.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nt-commerce.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # p126: security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


}
